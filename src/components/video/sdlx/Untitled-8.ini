Архитектура: HDMI Controller (master) -> (slave) Scan Doubler (slave) <- (master) Custom 6845

(
    // Тактирование и сброс входного домена
    input  logic src_clk_i,                         // Тактовая частота входного домена (32Mhz)
    input  logic src_rst_i,                         // Сброс входного домена
    
    // Входной видеоинтерфейс
    input  logic [DATA_WIDTH-1:0] src_pixel_data_i, // Данные входного пикселя
    input  logic src_rd_i,                          // Чтение пикселя от 6845
    input  logic src_newline_i,                     // Строб последнего пиксела строки (1 пиксель 32MHz)
    input  logic src_newframe_i,                    // Строб последнего пиксела кадра (1 пиксель 32MHz)
    output logic src_sync_o,                        // Строб dst_newframe_i пропущеный через защиту метастабильности (1 пиксель 32MHz)

    // Тактирование и сброс выходного домена
    input  logic dst_clk_i,                         // Тактовая частота выходного домена (27MHz)
    input  logic dst_rst_i,                         // Сброс выходного домена
    
    // Выходной видеоинтерфейс
    input logic dst_newline_i,                     // Строб последнего пиксела строки (1 пиксель 27MHz)
    input logic dst_newframe_i,                    // Строб последнего пиксела кадра (1 пиксель 27MHz)
    input logic dst_rd_i                           // Чтение пиксела по запросу HDMI
    output logic [DATA_WIDTH-1:0] dst_pixel_data_o, // Данные выходного пикселя
);  

src_sync_o важнейший сигнал говорит CRT c это начала нового кадра можешь загружать новые строки в в буффер

0,0    .................................... 719,0
0,1    .................................... 719,1
       .................................... 
       ....................................
0,239  .................................... 719,239
0,239  .................................... (719,239)< dst_newframe_i
       ..................BLANK AREA........
       .................................... 
       .................................... < CRT начинает загрузку первой строки
0,0    .................................... 719,0 < HDMI начинает воспроизведение



