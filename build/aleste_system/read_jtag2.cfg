# stable_jtag2.cfg
adapter driver cmsis-dap
cmsis-dap vid_pid 0x1d50 0x602b
source [find interface/cmsis-dap.cfg]
transport select jtag
adapter speed 1000

# Ожидаем стабильный IDCODE
jtag newtap fpga tap -irlen 4 -ircapture 0x1 -expected-id 0x10001FFF

init


# 1. Читаем IDCODE (проверка)
irscan fpga.tap 0x01
set id [drscan fpga.tap 32 0]
puts "ICODE:$id"
set raw_data [drscan fpga.tap 32 0]

# 2. Читаем debug данные
irscan fpga.tap 0x02
set dbg [drscan fpga.tap 32 0]
puts "DEBUG_DATA:$dbg"

exit
